name: Diagnose product tracking

on:
  workflow_dispatch:

concurrency:
  group: diagnose-product-tracking
  cancel-in-progress: false

jobs:
  diagnose:
    name: Windows CRM product-tracking diag
    runs-on: ubuntu-latest
    steps:
      - name: SSH diagnose on Windows PC
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
            $path = '${{ secrets.CRM_DEPLOY_PATH }}'
            if ([string]::IsNullOrWhiteSpace($path)) { $path = 'D:\crm-api.bmgenie.ai' }
            Set-Location $path
            Write-Host "CRM root: $path"

            function Get-DotEnvValue([string]$key) {
              $envPath = Join-Path $path '.env'
              if (-not (Test-Path $envPath)) { return $null }
              foreach ($line in Get-Content $envPath) {
                if ($line -match '^\s*#' -or $line -notmatch '=') { continue }
                $parts = $line.Split('=', 2)
                if ($parts[0].Trim() -eq $key) {
                  return $parts[1].Trim().Trim('"').Trim("'")
                }
              }
              return $null
            }

            $ingestKey = Get-DotEnvValue 'CRM_INGEST_API_KEY'
            $bmgenieUrl = Get-DotEnvValue 'BMGENIE_API_URL'
            Write-Host ("CRM_INGEST_API_KEY set: " + (-not [string]::IsNullOrWhiteSpace($ingestKey)))
            Write-Host ("BMGENIE_API_URL: " + $bmgenieUrl)

            $js = @'
            const Database = require('better-sqlite3');
            const db = new Database('./data/crm.db', { readonly: true });
            const recent = db.prepare("SELECT email, source, status, created_at FROM leads ORDER BY created_at DESC LIMIT 20").all();
            const bySource = db.prepare('SELECT source, COUNT(*) AS c FROM leads GROUP BY source ORDER BY c DESC').all();
            console.log(JSON.stringify({ total: db.prepare('SELECT COUNT(*) AS c FROM leads').get().c, bySource, recent }, null, 2));
            '@
            Set-Content -Path .\diag-leads-tmp.cjs -Value $js -Encoding UTF8
            Write-Host '--- Local CRM leads ---'
            node .\diag-leads-tmp.cjs
            Remove-Item .\diag-leads-tmp.cjs -Force -ErrorAction SilentlyContinue

            if ($bmgenieUrl -and $ingestKey) {
              $base = $bmgenieUrl.TrimEnd('/')
              $headers = @{ 'X-CRM-Ingest-Key' = $ingestKey; 'Accept' = 'application/json' }
              foreach ($sub in @(
                '/api/crm-analytics/daily-new-users?date=2026-09-22',
                '/api/crm-analytics/daily-new-users?date=2026-09-21',
                '/api/crm-analytics/daily-new-users?date=2026-09-20',
                '/api/crm-analytics/daily-new-users?date=2026-09-19',
                '/api/crm-analytics/daily-no-listings?date=2026-09-22',
                '/api/crm-analytics/free-not-paid?date=2026-09-22'
              )) {
                $url = "$base$sub"
                Write-Host "--- GET $url ---"
                try {
                  $res = Invoke-RestMethod -Uri $url -Headers $headers -TimeoutSec 25
                  Write-Host ("count=" + $res.count + " timezone=" + $res.timezone)
                  if ($res.users -and $res.users.Count -gt 0) {
                    $emails = @($res.users | Select-Object -First 15 | ForEach-Object { $_.email }) -join ', '
                    Write-Host ("sample: " + $emails)
                  }
                } catch {
                  Write-Host ("FAILED: " + $_.Exception.Message)
                  if ($_.ErrorDetails.Message) { Write-Host $_.ErrorDetails.Message }
                }
              }
            }

            Write-Host 'DIAG_DONE'
            exit 0
