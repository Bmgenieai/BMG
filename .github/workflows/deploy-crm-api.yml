name: Deploy CRM API to Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-crm-api-windows
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CRM API (Windows)
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy on Windows PC
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
            $path = '${{ secrets.CRM_DEPLOY_PATH }}'
            if ([string]::IsNullOrWhiteSpace($path)) { $path = 'D:\crm-api.bmgenie.ai' }
            if (-not (Test-Path $path)) { throw "CRM path not found: $path" }
            Set-Location $path
            # Pull FIRST so we run the latest deploy script (not the previous commit's copy)
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw 'git reset --hard failed' }

            # Upsert BREVO_WEBHOOK_SECRET into Windows .env from GitHub Actions secret (no RDP).
            # After first successful deploy you may delete the GH secret + remove this block;
            # the value will remain in the server .env (deploy never wipes .env).
            $webhookSecret = '${{ secrets.BREVO_WEBHOOK_SECRET }}'
            if (-not [string]::IsNullOrWhiteSpace($webhookSecret)) {
              $envPath = Join-Path $path '.env'
              if (-not (Test-Path $envPath)) { throw '.env missing on server' }
              $lines = Get-Content -Path $envPath -ErrorAction Stop
              $found = $false
              $out = New-Object System.Collections.Generic.List[string]
              foreach ($line in $lines) {
                if ($line -match '^\s*BREVO_WEBHOOK_SECRET\s*=') {
                  $out.Add("BREVO_WEBHOOK_SECRET=$webhookSecret") | Out-Null
                  $found = $true
                } else {
                  $out.Add($line) | Out-Null
                }
              }
              if (-not $found) {
                $out.Add('') | Out-Null
                $out.Add("BREVO_WEBHOOK_SECRET=$webhookSecret") | Out-Null
              }
              Set-Content -Path $envPath -Value $out -Encoding utf8
              Write-Host 'BREVO_WEBHOOK_SECRET upserted into .env'
            } else {
              Write-Host 'BREVO_WEBHOOK_SECRET GitHub secret empty — skipped .env upsert'
            }

            & .\scripts\windows\deploy-crm-api.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\scripts\windows\verify-crm-api.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host 'ALL_OK'
            exit 0
