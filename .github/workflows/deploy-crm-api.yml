name: Deploy CRM API to Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-crm-api-windows
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy CRM API (Windows)
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy on Windows PC
        uses: appleboy/ssh-action@v1.2.0
        env:
          SENDER_MAILBOX_SYNC: ${{ secrets.SENDER_MAILBOX_SYNC }}
          SENDER_MAILBOX_IMAP_HOST: ${{ secrets.SENDER_MAILBOX_IMAP_HOST }}
          SENDER_MAILBOX_IMAP_PORT: ${{ secrets.SENDER_MAILBOX_IMAP_PORT }}
          SENDER_MAILBOX_USER: ${{ secrets.SENDER_MAILBOX_USER }}
          SENDER_MAILBOX_PASS: ${{ secrets.SENDER_MAILBOX_PASS }}
          SENDER_MAILBOX_SYNC_MS: ${{ secrets.SENDER_MAILBOX_SYNC_MS }}
          SENDER_MAILBOX_LOOKBACK_DAYS: ${{ secrets.SENDER_MAILBOX_LOOKBACK_DAYS }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          # Passed into the remote PowerShell session; deploy-crm-api.ps1 upserts into .env
          envs: SENDER_MAILBOX_SYNC,SENDER_MAILBOX_IMAP_HOST,SENDER_MAILBOX_IMAP_PORT,SENDER_MAILBOX_USER,SENDER_MAILBOX_PASS,SENDER_MAILBOX_SYNC_MS,SENDER_MAILBOX_LOOKBACK_DAYS
          script: |
            Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
            $path = '${{ secrets.CRM_DEPLOY_PATH }}'
            if ([string]::IsNullOrWhiteSpace($path)) { $path = 'D:\crm-api.bmgenie.ai' }
            if (-not (Test-Path $path)) { throw "CRM path not found: $path" }
            Set-Location $path
            # Pull FIRST so we run the latest deploy script (not the previous commit's copy)
            git fetch origin main
            if ($LASTEXITCODE -ne 0) { throw 'git fetch failed' }
            git reset --hard origin/main
            if ($LASTEXITCODE -ne 0) { throw 'git reset --hard failed' }
            & .\scripts\windows\deploy-crm-api.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & .\scripts\windows\verify-crm-api.ps1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host 'ALL_OK'
            exit 0
